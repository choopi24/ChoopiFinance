<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover + the safe-area insets in app.css keep the bottom bar
       clear of the iPhone home indicator. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F7FA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1120" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <title>Choopi Finance</title>
  <meta name="description" content="Self-hosted personal investment tracker.">

  <!-- Installed-app behaviour. The manifest covers Android and desktop Chrome;
       the apple-* tags are what iOS reads, since Safari ignores the manifest's
       display mode for Add to Home Screen. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Choopi">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="icon" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <!-- iOS needs a PNG here; it will not use an SVG. -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

  <!-- Runs before first paint so a dark-mode phone never flashes white. -->
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app" class="app"></div>

  <!-- Fixed chrome, outside the routed area so it survives navigation. -->
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="layers"></div>

  <script src="/vendor/chart.umd.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
